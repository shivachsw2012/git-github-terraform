name: Terraform Apply Reusable Workflow
on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  #Below secrets are inherited from the parent workflow
  # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  RUN_CHECKOV_SCAN: false 
  AWS_REGION: ${{ vars.AWS_REGION}}
  ENV_DESTROY_DEV: "NO"
  ENV_DESTROY_PROD: "NO"
  TERRAFORM_DESTROY: ${{ vars.TERRAFORM_DESTROY}}
  TERRAFORM_VERSION: "1.14.1"
  
jobs:
  reusable-workflow-job-terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Alpha-Bravo
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::053490018989:role/awsb73-github-actions-oidc-role"
          role-session-name: github-action-oidc-role
          aws-region: "us-east-1"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Print Branch Reference & Folder
        run: echo The Current Branch Is $GITHUB_REF && pwd && ls -al
      - name: Terraform Init, Format, Validate
        run: |
          terraform init
          terraform fmt
          terraform validate
      - name: Creating Terraform Workspace
        shell: bash
        run: |
          rm -rf .terraform && terraform init
          terraform workspace select dev || terraform workspace new dev
          terraform workspace select prod || terraform workspace new prod
          terraform workspace list
      - name: Terraform Apply
        run: |
          echo ${{ env.ENV_DESTROY_DEV }}
          echo ${{ env.ENV_DESTROY_PROD }}
          if [[ ${GITHUB_REF} == 'refs/heads/development' && ${{ env.ENV_DESTROY_DEV }} == 'NO' ]]; then
            echo "Running Terraform Apply For Development Environment"
            terraform workspace select dev
            terraform apply --var-file=Alpha.tfvars --auto-approve
          elif [[ ${GITHUB_REF} == 'refs/heads/production' && ${{ env.ENV_DESTROY_PROD }} == 'NO' ]]; then
            echo "Running Terraform Apply For Production Environment"
            terraform workspace select prod
            terraform apply --var-file=Bravo.tfvars --auto-approve
          else
            echo "Nothing Is Deployed As The Branch Is Not Dev or Prod."
          fi

# Reusable workflows allow you to reuse an entire workflow, including all its jobs and steps. This is useful when you have a complete CI/CD process that you want to use across multiple repositories. By creating a reusable workflow, you can maintain a single source of truth for your CI/CD process and promote best practices across your organization.